# First RGB-D PPO baseline. Source/destination positions are visible only in the camera image.
#
# rgbd_pp_v1 (2026-08-08) ran single-env (DummyVecEnv, n_envs=1) at ~7-8 fps -- CPU-bound
# software MuJoCo rendering per step, no shared GPU context -- and was killed (terminal/session
# closed, not a code crash: log ends mid-stream with no traceback, error.log is empty) at step
# 24064/2000000, before ever reaching eval_freq=200000, so it produced zero checkpoints/videos.
# n_envs now parallelizes rendering across worker processes (see train_rgbd_pick_place.py
# make_env/SubprocVecEnv); eval/video/analysis cadence lowered accordingly so artifacts actually
# appear at a visible cadence instead of requiring ~7 hours of uninterrupted uptime for the first one.
n_envs: 6
total_timesteps: 2000000
log_freq: 5000
eval_freq: 20000
analysis_freq: 60000
stall_window_steps: 45000
n_eval_episodes: 10
video_freq: 20000
learning_rate: 0.0003
n_steps: 128
batch_size: 64
# History: 0.003 (stable, pick_place's proven value) -> 0.015 for rgbd_pp_v9's fresh init
# (2026-08-13, to counter v6-v8's action-boundary saturation, see git history/HANDOFF.md) -> back
# to 0.003 (2026-08-19). rgbd_pp_v9 died (machine restart, unrelated) after ~330k steps with `std`
# climbing monotonically 1.0 -> 1.59 the entire run, no sign of plateauing -- textbook entropy
# runaway, exactly the failure mode flagged as a risk when 0.015 was chosen (pick_place's own
# history already found 0.01 caused this on a simpler state-only observation; 0.015 on a harder
# image-based task was always going to be at least as risky). User reported "arm hits the box"
# around this time, consistent with an increasingly noisy/random policy from runaway std, not a
# reward or kinematics problem. Unlike the earlier action-saturation pathology, this one doesn't
# need a fresh init -- entropy runaway is a live, reversible effect of the coefficient itself, so
# resuming from the last checkpoint with ent_coef corrected back down should let std start
# decreasing again as training continues. If it doesn't (std keeps climbing even at 0.003), that's
# a different problem and worth a fresh diagnostic pass rather than another blind coefficient change.
ent_coef: 0.003
features_dim: 128
device: auto
policy_kwargs:
  net_arch:
    pi: [128, 128]
    vf: [128, 128]
