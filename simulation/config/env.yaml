# Gymnasium bin-picking environment. See simulation/docs/ASSUMPTIONS.md "Task / RL" table.

# 6.2: both arms controllable (6.1 verified [right] alone first). Multi-object *target selection*
# (which of several objects to grasp) is out of scope for this milestone either way -- one
# designated object (object_0) is always the tracked grasp target, regardless of how many objects
# are in the bin; see sim_env/bin_picking_env.py docstring.
active_arms: [left, right]

control_hz: 20
physics_hz: 500 # must match models/mjcf/scene.xml's <option timestep="0.002"/> (1/0.002 = 500)
episode_max_steps: 200 # 10 s of episode time at control_hz=20

# Velocity cap used by sim_env/trajectory_shaper.py to ramp the position-actuator reference
# instead of snapping it every control tick -- approximates the real ODrive's trapezoidal-
# trajectory position control (ARCHITECTURE.md §3), acceleration-limiting is not modeled (a
# velocity-only ramp is a reasonable first-pass approximation for this milestone).
# MuJoCo does not preserve URDF <limit velocity="..."/> on compiled joints, so these are restated
# here and must be kept in sync with humanoid.urdf by hand -- see ASSUMPTIONS.md.
max_arm_joint_velocity_rad_s: 2.0944 # 120 deg/s, matches arm joints' URDF velocity limit
max_gripper_velocity_m_s: 0.1 # matches gripper finger joints' URDF velocity limit

# Reset pose (radians), applied to every active arm's 3 joints on reset() -- the sim-scoped,
# not-yet-hardware-validated answer to ARCHITECTURE.md §9's open "reference zero pose" item.
# Chosen to put the end effector roughly above the bin, arm partway extended, not at a joint
# limit or the gravity-stable full-hang rest pose (which is a poor RL starting point -- zero
# initial error to move away from and closer to a singular configuration).
ready_pose_rad:
  shoulder_yaw: 0.0 # neutral -- yaw=0 reproduces the exact pre-yaw-DOF pose/EE position
  shoulder_pitch: -1.0472 # -60 deg
  shoulder_roll: 0.6981 # 40 deg
  elbow: 1.0472 # 60 deg

# Reward design (v2.2): see sim_env/rewards.py's module docstring for the full history --
# v1 (distance + sparse grasp/lift only) plateaued at 0% success; v2 added continuous per-step
# proximity/contact bonuses to bridge that gap, but a real reward-hacking exploit was found
# during v2 training (the policy farmed a continuous "gripper closed nearby" bonus without ever
# touching the object). v2.2 replaces every continuous bonus below the lift term with a ONE-TIME
# per-episode milestone bonus, which cannot be re-collected by holding still -- a structural fix,
# not a patch. Milestone ladder: reduce distance (continuous) -> first contact (touch_bonus,
# once) -> full two-finger grasp (grasp_bonus, once) -> sustained lift (lift_bonus_weight,
# continuous but tied to genuine object height, which can't be faked without a real grasp).
reward:
  distance_weight: -3.0 # per meter of EE-to-object distance, every step (v6: steepened from -2.0,
                        # see v6 note below -- still a continuous potential, no camping benefit)
  touch_bonus: 6.0 # one-time, first step ANY finger contacts the object (v6: raised from 2.0)
  grasp_bonus: 12.0 # one-time, first step BOTH fingers of one arm contact the object simultaneously (v6: raised from 5.0)
  lift_bonus_weight: 20.0 # per meter of object height above the bin floor, only while grasped
  step_penalty: -0.01
  knockout_penalty: -5.0

  # v9 (queued, OFF for v8 -- see BinPickingEnv._ee_pos's caller in step() for the gating):
  # every run so far converges to a near-static hover close to the object and then just holds
  # there for the rest of the episode -- once the distance-shaping reward stops improving, there's
  # no PRESSURE to keep trying different fine movements that might eventually land on contact,
  # since holding still is free (doesn't lose reward) even though it never gains any either. This
  # is a continuous per-step penalty (not a one-time milestone), but unlike v2's exploit, a penalty
  # can't be farmed for positive reward -- the worst case if the agent "games" it is minimal
  # jitter that avoids the penalty without genuine exploration, which is a weak signal, not a false
  # reward inflation, so it doesn't reopen the v2 pattern. Applied to the SAME arm used for the
  # distance term (the closest one), not both arms, so the idle arm sitting still isn't penalized.
  stuck:
    enabled: false # v9 tried this (true): regressed contact rate from v8's 10-20% to ~0%, root-
    # caused to firing on 48% of steps -- likely suppressing the careful slow approach grasping
    # needs, not just idle freezing. Reverted for v10 so the reachability fix (below) is the one
    # new variable this run, not compounded with a mechanism already shown to hurt.
    penalty: -0.05 # per step, while stuck (continuous, small relative to distance_weight/step)
    movement_threshold_m: 0.001 # EE displacement below this, this step, counts as "not moving"
    steps_threshold: 15 # consecutive not-moving steps (~0.75s at 20Hz) before the penalty starts

# v5 change: v1-v4 all learned to efficiently reduce EE-to-object distance across the whole bin
# footprint but never discovered actual contact (see training/TRAINING_LOG.md) -- consistent with
# an exploration problem (contact is rare to stumble into across the full ~0.30x0.20 m bin), not
# a network-capacity problem. Curriculum: spawn the object in a small region close to one arm's
# ready-pose reach instead of the full bin, so contact is far more likely to be found early in
# training and the touch/grasp milestone bonuses actually get reinforced. Targets are chosen
# within the bin's own footprint (bin inner half-extents 0.15 x 0.10 m around config/scene.yaml's
# center) as close as that allows to each arm's ready-pose EE position -- the ready pose itself
# points somewhat outside the bin laterally, so this narrows the gap rather than eliminating it.
#
# v6 change: v5 reliably converged to *near* the object (reward plateaued at -28 to -32 from 100k
# onward) but never crossed into contact at any evaluated checkpoint, 20k through 500k -- a
# last-mile precision problem, not a "can't find the object" problem. Two changes: (1) narrowed
# spawn_radius_m 0.02 -> 0.006 (3x tighter) so the object sits almost exactly at the target point,
# minimizing the precision the policy needs to discover to make contact; (2) roughly tripled
# touch_bonus/grasp_bonus and steepened distance_weight, on the theory that a hovering-but-not-
# touching policy may be risk-averse -- closing the last few cm risks knocking the object out of
# the bin (knockout_penalty -5.0) for a touch_bonus that, at v5's 2.0, may not have been worth that
# risk relative to the safe, already-collected distance-shaping reward. Both bonuses stay one-time
# per episode (rewards.py's v2.2 structural fix), so this isn't reopening the v2 exploit -- only
# their size changed, not their (non-continuous) shape.
#
# v8 change: watching v6's rendered rollout showed the actual mechanism behind "gets close but
# never touches" -- the gripper was pressed into the bin wall next to the object, not on the
# object. The v5/v6 targets (Y=+-0.08) left only 0.02 m of clearance to the nearest wall
# (bin inner half-depth 0.10 m), but the gripper's own max jaw opening is 0.06 m -- it physically
# cannot open around the object with 3x less clearance than its own open width requires. This was
# true for v5, v6, AND the first (aborted) v7 attempt, all three sharing this target; likely the
# dominant reason none of them ever made contact regardless of reward shape, curriculum radius, or
# reward reference point. Moved |Y| from 0.08 -> 0.02 (0.08 m clearance to the wall, comfortably
# more than the 0.06 m jaw needs) -- verified reachable by check_env.py before launch.
curriculum:
  enabled: true
  spawn_radius_m: 0.006
  targets:
    left: [0.15, 0.02, 0.835]
    right: [0.15, -0.02, 0.835]

success:
  lift_height_m: 0.05 # object must be grasped AND this high above the bin floor
  hold_steps: 10 # for this many consecutive control steps, to count as a successful grasp

failure:
  # object center leaving the bin's inner footprint (config/scene.yaml) by more than this margin,
  # in XY, counts as "knocked out of the bin" and ends the episode.
  out_of_bin_margin_m: 0.05
