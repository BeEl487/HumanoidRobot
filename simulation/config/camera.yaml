# RGB camera for the suction pick-place / RGB-D task. No camera has been chosen for the real
# robot, and no head/neck link exists in the architecture at all (the torso is the topmost body
# segment) — this is a realistic placeholder spec. See simulation/docs/ASSUMPTIONS.md "Camera" table.
#
# 2026-08-13 PIVOT: was a torso-mounted "head camera" (co-moving with the robot, looking forward
# over its own shoulder at the workspace). Moved to an external, stationary camera on the opposite
# side of the table from the robot, looking back across the boxes toward the robot -- because with
# the robot's own hand approaching the box from its own side, a robot-mounted forward-looking
# camera has the hand directly between itself and the cube during approach (confirmed: policy
# oscillated near-but-not-touching the cube, root-caused to the camera_occlusion_penalty reward
# term fighting the close-approach term whenever the only reachable approach path crossed the
# camera's sightline). With the camera across the table, the cube sits in the foreground and the
# approaching arm is behind it from the camera's view for almost the entire approach -- occlusion
# becomes structural rather than something the reward has to teach against.
# Implementation note: still attached to torso_link in the MJCF (simplest -- no new body needed),
# which is equivalent to a true world-fixed camera ONLY because the robot's base never moves in
# this sim (no gimbal/locomotion, ASSUMPTIONS.md meta-assumption M1); this is NOT free-standing
# hardware and does not imply a real fixed-workspace-camera decision has been made -- see
# docs/ARCHITECTURE.md "Camera" section for that flag, same pattern as the shoulder_yaw DOF pivot.
name: head_camera

# Mount offset from torso_link origin (m), in the torso's local frame (X=forward, Y=left, Z=up).
# World-space target: X~0.45 (just beyond the table's far edge at X=0.385, table center_xy[0]=0.205
# + top_size_xy[0]/2=0.18), Y=-0.12 (midpoint between the source box Y=0.02 and destination box
# Y=-0.26), Z~1.05 (same absolute height as the old head-camera position). torso_link's own world
# origin is (0,0,0.90) (MOUNT_HEIGHT_M in scripts/reachability_check.py), so local = world - that.
mount_pos: [0.45, -0.12, 0.15]

# Heading (deg) about vertical, 0 = torso-forward/+X (the old head-camera convention), 180 = facing
# back toward the robot -- what the opposite-side placement above needs.
yaw_deg: 180.0

# Downward pitch from horizontal (deg) — angles the camera down at the boxes. Computed from the
# new geometry: horizontal distance from camera to box center (~0.29m in X) vs. vertical drop to
# box height (~0.23m) gives atan2(0.23,0.29)=38.5 deg; 42 gives a small margin toward framing the
# nearer parts of the source box's spawn range too. Re-verify against a coverage check if the box
# positions or camera mount ever change (same discipline as the FOV widening below).
pitch_down_deg: 42.0

# Horizontal field of view (deg). Was 58.0 (representative of a narrow commodity module) until
# scripts/check_camera_coverage.py caught that the camera, mounted this close to the workspace
# (~0.13-0.3 m to the bin), only framed ~55% of the object's randomized spawn area at that FOV --
# confirmed by a real policy rollout where the head-camera view showed an empty bin. Widened to
# 90 deg (a wide-angle lens, physically realistic for a close-range workspace camera -- many real
# robot head/wrist cameras use 90-120 deg lenses for exactly this reason) and re-verified at 100%
# coverage. Converted to MuJoCo's vertical fovy at build time for whatever resolution is requested
# (see scripts/build_model.py:hfov_to_fovy) — not a fixed fovy number, so it stays correct if the
# resolution/aspect ratio below changes.
horizontal_fov_deg: 90.0

# RL-training resolution: small, fast to render, standard for image-observation RL.
resolution_default: [640, 480]

# Debug/inspection resolution, used by camera_smoke_test.py and manual snapshots — not used
# during training.
resolution_debug: [1280, 720]

near_clip: 0.02
