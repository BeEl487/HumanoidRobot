# Head-equivalent RGB camera. No camera has been chosen for the real robot, and no head/neck
# link exists in the architecture at all (the torso is the topmost body segment) — this is a
# realistic placeholder spec, fixed rigidly to the top-front of the torso so it co-moves with the
# torso the way a head-mounted camera would. See simulation/docs/ASSUMPTIONS.md "Camera" table.

name: head_camera

# Mount offset from torso_link origin (m), in the torso's local frame (X=forward, Y=left, Z=up).
# z raised to 0.15 (torso top edge, was 0.13) as part of the coverage fix below.
mount_pos: [0.07, 0.0, 0.15]

# Downward pitch from horizontal (deg) — angles the camera toward the workspace in front of the
# robot rather than the horizon. Was 30.0; steepened to 55.0 -- see horizontal_fov_deg comment,
# this and the FOV widening were tuned together against scripts/check_camera_coverage.py.
pitch_down_deg: 55.0

# Horizontal field of view (deg). Was 58.0 (representative of a narrow commodity module) until
# scripts/check_camera_coverage.py caught that the camera, mounted this close to the workspace
# (~0.13-0.3 m to the bin), only framed ~55% of the object's randomized spawn area at that FOV --
# confirmed by a real policy rollout where the head-camera view showed an empty bin. Widened to
# 90 deg (a wide-angle lens, physically realistic for a close-range workspace camera -- many real
# robot head/wrist cameras use 90-120 deg lenses for exactly this reason) and re-verified at 100%
# coverage. Converted to MuJoCo's vertical fovy at build time for whatever resolution is requested
# (see scripts/build_model.py:hfov_to_fovy) — not a fixed fovy number, so it stays correct if the
# resolution/aspect ratio below changes.
horizontal_fov_deg: 90.0

# RL-training resolution: small, fast to render, standard for image-observation RL.
resolution_default: [640, 480]

# Debug/inspection resolution, used by camera_smoke_test.py and manual snapshots — not used
# during training.
resolution_debug: [1280, 720]

near_clip: 0.02
