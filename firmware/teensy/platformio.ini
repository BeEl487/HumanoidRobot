[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; FlexCAN_T4 is the standard native-CAN driver for Teensy 4.x (exposes CAN1/CAN2/CAN3,
; matching the 3 physical buses this robot needs per docs/ARCHITECTURE.md §4).
; Not version-pinned yet: this is the first-ever build in this tree, so there is no
; known-good version to pin against. Once this milestone is verified working, pin the
; resolved version here so later builds are reproducible.
lib_deps =
    tonton81/FlexCAN_T4

monitor_speed = 115200
